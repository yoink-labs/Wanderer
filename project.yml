name: Wanderer
options:
  bundleIdPrefix: com.wanderer
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.0.0"

targets:
  Wanderer:
    type: application
    platform: iOS
    sources:
      - path: Wanderer
    dependencies:
      - package: Supabase
        product: Supabase
    configFiles:
      Debug: Config/Supabase.xcconfig
      Release: Config/Supabase.xcconfig
    settings:
      base:
        INFOPLIST_FILE: Wanderer/Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.wanderer.ios
        PRODUCT_NAME: Wanderer
        PRODUCT_MODULE_NAME: Wanderer
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Wanderer
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        CODE_SIGN_STYLE: Automatic
    scheme:
      gatherCoverageData: false
      testTargets:
        - WandererTests

  WandererTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: WandererTests
    dependencies:
      - target: Wanderer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wanderer.ios.tests
        PRODUCT_MODULE_NAME: WandererTests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Wanderer.app/Wanderer"
        BUNDLE_LOADER: "$(TEST_HOST)"
